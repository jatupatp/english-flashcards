    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 5px;
            font-size: 24px;
        }

        .counter {
            font-size: 14px;
            color: #718096;
            margin-bottom: 25px;
        }

        .card {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            padding: 30px 20px;
            margin-bottom: 30px;
            min-height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .word {
            font-size: 34px;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 5px;
            word-break: break-word;
        }

        .part-of-speech {
            font-style: italic;
            color: #718096;
            margin-bottom: 15px;
            font-size: 15px;
        }

        .meaning {
            font-size: 20px;
            color: #e53e3e;
            font-weight: 600;
            margin-bottom: 15px;
            display: none;
        }

        .example {
            font-size: 14px;
            color: #4a5568;
            background: #edf2f7;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            text-align: left;
            line-height: 1.4;
            display: none;
            white-space: pre-line;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s ease, background 0.2s ease;
            flex: 1;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-reveal {
            background: #4a5568;
            color: white;
        }

        .btn-reveal:hover {
            background: #2d3748;
        }

        .btn-next {
            background: #3182ce;
            color: white;
        }

        .btn-next:hover {
            background: #2b6cb0;
        }
    </style>
</head>
