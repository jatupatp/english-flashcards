<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Flashcards - ระบบสุ่มคำศัพท์</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 5px;
            font-size: 24px;
        }

        .counter {
            font-size: 14px;
            color: #718096;
            margin-bottom: 25px;
        }

        .card {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            padding: 40px 20px;
            margin-bottom: 30px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .word {
            font-size: 36px;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 10px;
        }

        .part-of-speech {
            font-style: italic;
            color: #718096;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .meaning {
            font-size: 22px;
            color: #e53e3e;
            font-weight: 600;
            margin-bottom: 15px;
            display: none; /* ซ่อนคำแปลภาษาไทยไว้ก่อน */
        }

        .example {
            font-size: 14px;
            color: #4a5568;
            background: #edf2f7;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            text-align: left;
            line-height: 1.4;
            display: none; /* ซ่อนประโยคตัวอย่างไว้ก่อน */
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s ease, background 0.2s ease;
            flex: 1;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-reveal {
            background: #4a5568;
            color: white;
        }

        .btn-reveal:hover {
            background: #2d3748;
        }

        .btn-next {
            background: #3182ce;
            color: white;
        }

        .btn-next:hover {
            background: #2b6cb0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📝 English Flashcards</h1>
        <div class="counter" id="vocab-count">คลังคำศัพท์: 0 คำ</div>
        
        <div class="card">
            <div class="word" id="word">กำลังโหลด...</div>
            <div class="part-of-speech" id="pos"></div>
            <div class="meaning" id="meaning"></div>
            <div class="example" id="example"></div>
        </div>

        <div class="btn-group">
            <button class="btn-reveal" onclick="revealAnswer()">ดูเฉลย (แปลไทย)</button>
            <button class="btn-next" onclick="randomWord()">คำต่อไป</button>
        </div>
    </div>

    <script>
        // คลังคำศัพท์จัดเต็ม (คำศัพท์, ประเภทคำ, คำแปลไทย, ประโยคตัวอย่าง)
        const vocabulary = [
            { word: "Abandon", pos: "v.", meaning: "ละทิ้ง, ปล่อยปละละเลย", example: "The drivers were forced to abandon their cars in the snow." },
            { word: "Abundant", pos: "adj.", meaning: "มากมาย, อุดมสมบูรณ์", example: "The river provides an abundant supply of fish." },
            { word: "Accelerate", pos: "v.", meaning: "เร่งความเร็ว, เร่งให้เกิดขึ้น", example: "We need to accelerate the economic growth." },
            { word: "Accomplish", pos: "v.", meaning: "ทำสำเร็จ, บรรลุเป้าหมาย", example: "You can accomplish anything if you work hard." },
            { word: "Accumulate", pos: "v.", meaning: "สะสม, เก็บรวบรวม", example: "Dust quickly accumulates if we don't clean the room." },
            { word: "Accurate", pos: "adj.", meaning: "ถูกต้อง, แม่นยำ", example: "The computer model can provide accurate weather forecasts." },
            { word: "Advantage", pos: "n.", meaning: "ข้อได้เปรียบ, ผลประโยชน์", example: "Living in a big city has many advantages." },
            { word: "Advocate", pos: "v. / n.", meaning: "สนับสนุน, ผู้สนับสนุน", example: "He is a strong advocate for human rights." },
            { word: "Alternative", pos: "n. / adj.", meaning: "ทางเลือก, ซึ่งเลือกได้", example: "We need to find an alternative energy source." },
            { word: "Ambiguous", pos: "adj.", meaning: "กำกวม, คลุมเครือ", example: "His reply to my question was somewhat ambiguous." },
            { word: "Analyze", pos: "v.", meaning: "วิเคราะห์", example: "The scientists will analyze the blood samples." },
            { word: "Annual", pos: "adj.", meaning: "ประจำปี, ทุกปี", example: "The company holds its annual meeting in December." },
            { word: "Appreciate", pos: "v.", meaning: "เห็นคุณค่า, ซาบซึ้งใจ", example: "I really appreciate your help with this project." },
            { word: "Approach", pos: "v. / n.", meaning: "เข้าใกล้, วิธีการเข้าถึง", example: "We need a new approach to solve this problem." },
            { word: "Beneficial", pos: "adj.", meaning: "เป็นประโยชน์, ให้ผลดี", example: "Regular exercise is beneficial to your health." },
            { word: "Benevolent", pos: "adj.", meaning: "เมตตา, ใจดี", example: "The benevolent businessman donated money to the school." },
            { word: "Capable", pos: "adj.", meaning: "ที่มีความสามารถ", example: "She is a highly capable manager." },
            { word: "Challenge", pos: "n. / v.", meaning: "ความท้าทาย, ท้าทาย", example: "Learning a new language is a great challenge." },
            { word: "Collaborate", pos: "v.", meaning: "ร่วมมือกัน, ทำงานร่วมกัน", example: "Researchers are collaborating to find a cure." },
            { word: "Comprehensive", pos: "adj.", meaning: "ครอบคลุม, ครบถ้วน", example: "The book gives a comprehensive overview of European history." },
            { word: "Consequence", pos: "n.", meaning: "ผลลัพธ์ที่ตามมา", example: "Every action has a consequence." },
            { word: "Considerable", pos: "adj.", meaning: "มากมาย, สำคัญ", example: "The project required a considerable amount of time and money." },
            { word: "Contribute", pos: "v.", meaning: "มีส่วนช่วย, มอบให้", example: "Many clean energy sources contribute to reducing pollution." },
            { word: "Crucial", pos: "adj.", meaning: "สำคัญมาก, วิกฤต", example: "Thorough planning is crucial to the success of any business." },
            { word: "Diligent", pos: "adj.", meaning: "ขยันหมั่นเพียร", example: "She is a diligent student who always finishes her homework." },
            { word: "Diminish", pos: "v.", meaning: "ลดลง, ทำให้เล็กลง", example: "The pain will gradually diminish after taking the medicine." },
            { word: "Distribute", pos: "v.", meaning: "แจกจ่าย, กระจาย", example: "The company distributes its products worldwide." },
            { word: "Diverse", pos: "adj.", meaning: "หลากหลาย, แตกต่างกัน", example: "New York is a very culturally diverse city." },
            { word: "Efficient", pos: "adj.", meaning: "ที่มีประสิทธิภาพ", example: "The new machine is far more efficient than the old one." },
            { word: "Emphasize", pos: "v.", meaning: "เน้นย้ำ, ให้ความสำคัญ", example: "The teacher emphasized the importance of regular review." },
            { word: "Enhance", pos: "v.", meaning: "ทำให้ดีขึ้น, เสริม", example: "You can enhance your English skills by reading books." },
            { word: "Enormous", pos: "adj.", meaning: "ใหญ่โต, มหาศาล", example: "The elephant is an enormous animal." },
            { word: "Evaluate", pos: "v.", meaning: "ประเมินผล", example: "The teacher will evaluate your performance tomorrow." },
            { word: "Evidence", pos: "n.", meaning: "หลักฐาน", example: "There is no clear evidence that he committed the crime." },
            { word: "Exaggerate", pos: "v.", meaning: "พูดเกินจริง", example: "Don't exaggerate; the problem isn't that big." },
            { word: "Fluctuate", pos: "v.", meaning: "ผันผวน, ขึ้นๆ ลงๆ", example: "Gold prices fluctuate daily based on the market." },
            { word: "Generous", pos: "adj.", meaning: "ใจกว้าง, โอบอ้อมอารี", example: "Thank you for your generous hospitality." },
            { word: "Guarantee", pos: "v. / n.", meaning: "รับประกัน, การรับประกัน", example: "The company guarantees that the product is safe." },
            { word: "Identify", pos: "v.", meaning: "ระบุตัวตน, ชี้ตัว", example: "Passengers were asked to identify their own bags." },
            { word: "Inevitable", pos: "adj.", meaning: "ซึ่งหลีกเลี่ยงไม่ได้", example: "Change is an inevitable part of life." },
            { word: "Influence", pos: "v. / n.", meaning: "มีอิทธิพลต่อ, อิทธิพล", example: "Peer pressure can influence a teenager's behavior." },
            { word: "Innovation", pos: "n.", meaning: "นวัตกรรม, สิ่งใหม่", example: "The company is known for its technological innovation." },
            { word: "Investigate", pos: "v.", meaning: "สืบสวน, ตรวจสอบหาความจริง", example: "The police are currently investigating the robbery." },
            { word: "Justify", pos: "v.", meaning: "พิสูจน์ว่าถูก, ให้เหตุผลประกอบ", example: "You don't need to justify your actions to me." },
            { word: "Maintain", pos: "v.", meaning: "รักษาไว้, คงอยู่", example: "It is important to maintain a healthy lifestyle." },
            { word: "Negotiate", pos: "v.", meaning: "เจรจาต่อรอง", example: "We need to negotiate a better deal with our suppliers." },
            { word: "Objective", pos: "n. / adj.", meaning: "วัตถุประสงค์, ที่เป็นกลาง", example: "Our main objective is to improve customer service." },
            { word: "Obstacle", pos: "n.", meaning: "อุปสรรค", example: "Lack of money is a major obstacle to my study plan." },
            { word: "Opponent", pos: "n.", meaning: "คู่ต่อสู้, ฝ่ายตรงข้าม", example: "He defeated his opponent in the final match." },
            { word: "Participate", pos: "v.", meaning: "มีส่วนร่วม, เข้าร่วม", example: "Everyone is encouraged to participate in the discussion." },
            { word: "Permanent", pos: "adj.", meaning: "ถาวร, คงทน", example: "The damage to the building was permanent." },
            { word: "Predict", pos: "v.", meaning: "ทำนาย, คาดเดา", example: "It is difficult to predict the future accurately." },
            { word: "Prioritize", pos: "v.", meaning: "จัดลำดับความสำคัญ", example: "You must learn to prioritize your tasks." },
            { word: "Prohibit", pos: "v.", meaning: "ห้าม, ไม่อนุญาต", example: "Smoking is strictly prohibited inside the building." },
            { word: "Require", pos: "v.", meaning: "ต้องการ, บังคับใช้", example: "This job requires a lot of hard work and patience." },
            { word: "Resilient", pos: "adj.", meaning: "ยืดหยุ่น, ฟื้นตัวเร็ว", example: "The economy is resilient and will recover soon." },
            { word: "Significant", pos: "adj.", meaning: "สำคัญ, มีนัยสำคัญ", example: "There has been a significant increase in sales." },
            { word: "Sufficient", pos: "adj.", meaning: "เพียงพอ", example: "Make sure you get sufficient sleep tonight." },
            { word: "Temporary", pos: "adj.", meaning: "ชั่วคราว", example: "This is just a temporary solution to the problem." },
            { word: "Unanimous", pos: "adj.", meaning: "เป็นเอกฉันท์", example: "The committee reached a unanimous decision." },
            { word: "Validate", pos: "v.", meaning: "ตรวจสอบความถูกต้อง, ยืนยัน", example: "The test results validated our theory." },
            { word: "Vary", pos: "v.", meaning: "แตกต่างกันไป, เปลี่ยนแปลง", example: "Prices vary depending on the season." },
            { word: "Vulnerable", pos: "adj.", meaning: "อ่อนแอ, เปราะบาง", example: "The elderly are particularly vulnerable to the virus." }
        ];

        let currentWord = {};

        // แสดงจำนวนคำศัพท์ทั้งหมด
        document.getElementById("vocab-count").innerText = `คลังคำศัพท์: ${vocabulary.length} คำ`;

        function randomWord() {
            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * vocabulary.length);
            } while (vocabulary.length > 1 && vocabulary[randomIndex].word === currentWord.word);

            currentWord = vocabulary[randomIndex];

            document.getElementById("word").innerText = currentWord.word;
            document.getElementById("pos").innerText = `(${currentWord.pos})`;
            
            const meaningEl = document.getElementById("meaning");
            const exampleEl = document.getElementById("example");
            
            meaningEl.innerText = currentWord.meaning;
            exampleEl.innerText = `💡 Example:\n${currentWord.example}`;

            meaningEl.style.display = "none";
            exampleEl.style.display = "none";
        }

        function revealAnswer() {
            document.getElementById("meaning").style.display = "block";
            document.getElementById("example").style.display = "block";
        }

        randomWord();
    </script>
</body>
</html>
